<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Plain HTML host for the Setlist Pick 'Em embed</title>
  </head>
  <body>
    <h1>Fan page</h1>
    <p>This page is not the widget. The card loads in the frame below.</p>
    <iframe
      id="setlist-pickem-stats"
      title="Setlist Pick 'Em standings"
      width="360"
      height="240"
      style="border:0;max-width:100%"
      loading="lazy"
    ></iframe>
    <script>
      var params = new URLSearchParams(window.location.search);
      var src = params.get('src') || 'http://localhost:5173/embed/stats?card=badge';
      document.getElementById('setlist-pickem-stats').src = src;
    </script>
  </body>
</html>
