# Dependabot — weekly npm updates for the SPA and Cloud Functions (#414).
# Grouped PRs reduce noise; triage + first-run runbook: docs/DEPENDABOT_OPERATIONS.md
# PRs target `staging` (repo PR base), not `main`.
# Dependabot reads this file from the default branch (`main`).
#
# Re-enabled 2026-07-05 (Sprint 6 wrap, #504) after v1.18 enablement-wave ops reset.
# Reworked 2026-07-28 (#744): groups contain ONLY minor/patch ("safe") updates so
# they stay green and mergeable. Major versions arrive as individual PRs and get
# dedicated migration work — see docs/DEPENDABOT_OPERATIONS.md "Major upgrades".
# Profile B (#967): open-pull-requests-limit is 2 per entry. `*-safe` groups are
# squash auto-merged by .github/workflows/dependabot-auto-merge.yml.
# Monday 18:00 UTC sweep (#1052): .github/workflows/dependabot-scheduled-execution.yml
# enables that same squash auto-merge when the event workflow missed a `*-safe`
# PR, and comments when the PR has been red or conflicted for 7 days. The sweep
# does not change groups, limits, or the default rebase behavior.
# Never batch-rebase all PRs. Do not auto-merge majors or `actions-all`.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - skip-version-bump
    groups:
      root-production-safe:
        dependency-type: production
        update-types: ["minor", "patch"]
      root-development-safe:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/functions"
    target-branch: "staging"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - skip-version-bump
    ignore:
      # Re-checked 2026-09-24: firebase-functions-test@3.5.0 (latest) still
      # peers firebase-admin ^8–^13 only. firebase-functions@7.4.0 now peers
      # admin ^14, but functions `npm ci` still ERESOLVE on the test harness
      # (#624, #744, #799). Remove once firebase-functions-test allows ^14.
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]
    groups:
      functions-production-safe:
        dependency-type: production
        update-types: ["minor", "patch"]
      functions-development-safe:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: "staging"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - skip-version-bump
    groups:
      actions-all:
        patterns: ["*"]
