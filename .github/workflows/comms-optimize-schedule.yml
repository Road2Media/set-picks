# Scheduled Comms Optimize kickoff (#778 / epic #573).
# Posts a [SKIP-PRD] agent prompt on #573 when:
#   - yesterday was a show date (post_show → show_recap_uniqueness), or
#   - today is Monday America/Denver and there was no post-show (weekly rotation).
#
# Post-show kickoffs attach live narrative QA when GCP_CLIENT_EMAIL and
# GCP_PRIVATE_KEY are set. A failed live read skips that section.
# The Fenway fixture is not posted from this workflow.
# Does NOT run the full Leadership/Cursor squad (needs GA4 MCP + LLM).
# A Cloud Agent / Cursor Automation / human picks up the kickoff comment.
# Agents never merge or comms:deploy from this workflow.

name: Comms Optimize schedule

on:
  schedule:
    # ~09:00 America/Denver during MDT (15:00 UTC); after tour_rankings_daily 08:00 PT.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | weekly | post_show"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - weekly
          - post_show
      show_date:
        description: "Optional YYYY-MM-DD for post_show, or the missed show for replay"
        required: false
        type: string
      replay:
        description: "off leaves the kickoff unchanged. dry-run or send replays tour_rankings_daily for show_date."
        required: true
        default: "off"
        type: choice
        options:
          - off
          - dry-run
          - send

permissions:
  contents: read
  issues: write

jobs:
  kickoff:
    if: github.event_name == 'schedule' || inputs.replay == 'off' || inputs.replay == ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Resolve + post kickoff on #573
        env:
          GH_TOKEN: ${{ github.token }}
          GCP_CLIENT_EMAIL: ${{ secrets.GCP_CLIENT_EMAIL }}
          GCP_PRIVATE_KEY: ${{ secrets.GCP_PRIVATE_KEY }}
          MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'auto' }}
          SHOW_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.show_date || '' }}
        run: |
          set -euo pipefail
          ARGS=(--mode "$MODE" --post)
          if [ -n "${SHOW_DATE}" ]; then
            ARGS+=(--show-date "$SHOW_DATE")
          fi
          node scripts/comms-optimize-kickoff.mjs "${ARGS[@]}"

  replay-morning-rankings:
    if: github.event_name == 'workflow_dispatch' && (inputs.replay == 'dry-run' || inputs.replay == 'send')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      - name: Replay tour_rankings_daily
        env:
          GCP_CLIENT_EMAIL: ${{ secrets.GCP_CLIENT_EMAIL }}
          GCP_PRIVATE_KEY: ${{ secrets.GCP_PRIVATE_KEY }}
          SHOW_DATE: ${{ inputs.show_date }}
          REPLAY_MODE: ${{ inputs.replay }}
        run: |
          set -euo pipefail
          if [ -z "${SHOW_DATE}" ]; then
            echo "show_date is required for replay"
            exit 1
          fi
          if [ "${REPLAY_MODE}" = "send" ]; then
            node scripts/replay-tour-rankings-daily.mjs --show-date "${SHOW_DATE}" --confirm
          else
            node scripts/replay-tour-rankings-daily.mjs --show-date "${SHOW_DATE}"
          fi
