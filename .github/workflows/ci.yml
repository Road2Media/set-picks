# Runs fast baseline checks on every PR/push, then conditionally runs
# slower risk-weighted jobs (`rules`, `functions`, `qa-runners`) based on
# changed paths or explicit labels. A nightly schedule runs the full matrix.

name: CI

# Superseded pushes and PR updates cancel the older run (#967).
# The nightly schedule stays in its own group so a push to the default
# branch does not cancel the full-matrix backstop, and the backstop does
# not cancel that push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, master, staging]
  pull_request:
  schedule:
    - cron: '17 9 * * *'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.filter.outputs.functions }}
      rules: ${{ steps.filter.outputs.rules }}
      qa_risk: ${{ steps.filter.outputs.qa_risk }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            functions:
              - 'functions/**'
            rules:
              - 'firestore.rules'
              - 'firestore.indexes.json'
              - 'firestore.rules.test.cjs'
              - 'firestore.rules.test.*'
            deps:
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.*'
              - 'postcss.config.*'
              - 'tailwind.config.*'
            qa_risk:
              - 'src/app/**'
              - 'src/pages/**'
              - 'src/features/**/model/**'
              - 'src/features/**/api/**'
              - 'src/shared/lib/**'
              - 'src/main.*'
              - 'vite.config.*'
              - 'scripts/qa/**'
              - 'scripts/verify-*.mjs'
              - 'public/sw*.js'

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Phishnet deploy manifest (callable drift check)
        run: npm run verify:phishnet-deploy-manifest

      - name: Dashboard meta (IA drift check)
        run: npm run verify:dashboard-meta

      - name: Dashboard UI tokens (shell drift check)
        run: npm run verify:dashboard-ui

      - name: Homepage Open Graph (crawler meta)
        run: npm run verify:og-home

      - name: SEO prerender routes (crawler HTML)
        run: npm run verify:seo-prerender

      - name: Tour-stats SEO facts helpers (#928)
        run: npm run test:tour-stats-seo-facts

      - name: SEO query registry (#931)
        run: npm run test:seo-query-registry

      - name: SEO GSC weekly snapshot (#932)
        run: npm run test:seo-gsc-snapshot

      - name: SEO string sync (description mirrors)
        run: npm run verify:seo-strings

      - name: Marketing voice (em dash / banned phrase guard)
        run: npm run verify:marketing-voice

      - name: Client tests (vitest)
        run: npm test

      - name: Dependabot T0 auto-merge policy (#967, #1052)
        run: npm run test:dependabot-auto-merge

      - name: Shipped-issue close collector (#1149, #1174)
        run: npm run test:shipped-issue-close

      - name: Sphere recap recipient loader (#1194)
        run: npm run test:sphere-recap-recipients

      # Informational only (#414) — does not fail the job. Triage notes in AGENTS.md.
      - name: npm audit (informational)
        continue-on-error: true
        run: |
          echo "::group::root"
          npm audit --omit=dev || true
          echo "::endgroup::"
          echo "::group::functions"
          npm audit --omit=dev --prefix functions || true
          echo "::endgroup::"

      - name: Version bumped (SemVer gate)
        # PR-only check: ensures PRs targeting staging bump package.json past the
        # last release. Skipped on push/schedule where github.base_ref is empty
        # (so `!= 'main'` was accidentally true) and package.json legitimately
        # equals the last release tag once a release has been cut.
        if: github.event_name == 'pull_request' && github.base_ref != 'main' && !contains(github.event.pull_request.labels.*.name, 'skip-version-bump') && !startsWith(github.head_ref, 'dependabot/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the Releases API — reliable regardless of clone depth or tag fetch limits.
          TAGGED=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null || echo "v0.0.0")
          CURRENT=$(node -p "require('./package.json').version")
          echo "Latest release tag : $TAGGED"
          echo "package.json version: $CURRENT"
          if [ "v$CURRENT" = "$TAGGED" ]; then
            echo "❌ package.json version ($CURRENT) matches the last release tag ($TAGGED)."
            echo "   Bump the version in package.json and add a CHANGELOG.md entry before merging."
            echo "   See docs/API.md §6 for the bump decision table."
            echo "   Add the 'skip-version-bump' label if this PR has no API or feature impact."
            exit 1
          fi
          echo "✓ version $CURRENT is ahead of last release $TAGGED"

  # Dep-only PRs don't touch src/, so `verify` (lint + vitest, no build) and
  # qa-runners both stay silent while a toolchain bump can still break the
  # production bundle (#519 Tailwind 4 / #744). Run the real build whenever
  # the root manifest, lockfile, or build config changes.
  build:
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build (vite + SEO prerender)
        run: npm run build

  functions:
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.functions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            functions/package-lock.json
            emails/package-lock.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm ci

      # Marketing React Email bundle is gitignored; build before tests that render it.
      - name: Install emails dependencies and build marketing templates
        run: |
          npm ci --prefix emails
          npm run comms:sync
          npm run emails:build

      - name: Functions unit tests
        working-directory: functions
        run: npm test

  rules:
    needs: changes
    if: github.event_name == 'schedule' || needs.changes.outputs.rules == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase CLI
        run: npm install --no-save --prefix "$RUNNER_TEMP" firebase-tools@15

      - name: Firestore rules emulator tests
        run: "$RUNNER_TEMP/node_modules/.bin/firebase emulators:exec --only firestore --project setlist-pickem-rules-test 'node --test firestore.rules.test.cjs'"

  # Issue #347 — Playwright runners (§A/§B). Risk-gated for PR/push, full on nightly schedule.
  # Requires secrets; skip fork PRs (#349 auth).
  qa-runners:
    runs-on: ubuntu-latest
    # #748: a hung Playwright runner used to burn the full 6h workflow limit
    # (nightly matrix cancelled every night since 07-19). Warm-cache runs
    # finish in ~10 min; 20 min is generous headroom incl. Chromium download.
    timeout-minutes: 20
    needs: [verify, changes]
    if: >
      (github.event_name == 'schedule' ||
      needs.changes.outputs.qa_risk == 'true' ||
      (github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'ci/qa') ||
      contains(github.event.pull_request.labels.*.name, 'ci/full')))) &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    env:
      QA_PUBLIC_PROFILE_UID: ${{ secrets.QA_PUBLIC_PROFILE_UID }}
      QA_APPCHECK_DEBUG_TOKEN: ${{ secrets.QA_APPCHECK_DEBUG_TOKEN }}
      QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Browser binaries are large; cache by lockfile so most PRs skip re-download.
      # System deps still run via --with-deps (cheap vs Chromium fetch).
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium (full, cold cache)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright Chromium (warm cache)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      # npm scripts use `--env-file-if-exists=.env.qa.local`; CI has no file unless we
      # write it. Job `env` already exposes secrets to the process, but materializing
      # the file avoids "Continuing without it" noise and matches local workflows.
      - name: Require QA Actions secrets (or skip with clear error)
        run: |
          missing=""
          for v in QA_PUBLIC_PROFILE_UID QA_APPCHECK_DEBUG_TOKEN QA_TEST_EMAIL QA_TEST_PASSWORD; do
            eval "z=\$$v"
            if [ -z "${z:-}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::qa-runners needs Actions secrets (Settings → Secrets and variables → Actions): QA_PUBLIC_PROFILE_UID, QA_APPCHECK_DEBUG_TOKEN, QA_TEST_EMAIL, QA_TEST_PASSWORD. Missing or empty:$missing — see scripts/qa/README.md."
            exit 1
          fi
          printenv | grep -E '^QA_(PUBLIC_PROFILE_UID|APPCHECK_DEBUG_TOKEN|TEST_EMAIL|TEST_PASSWORD)=' > .env.qa.local

      - name: qa:chunks (recipe §A)
        run: npm run qa:chunks

      - name: qa:cache (recipe §B)
        run: npm run qa:cache

      - name: qa:google-signup (Google new-user gating + optional OAuth)
        env:
          QA_GOOGLE_TEST_EMAIL: ${{ secrets.QA_GOOGLE_TEST_EMAIL }}
          QA_GOOGLE_TEST_PASSWORD: ${{ secrets.QA_GOOGLE_TEST_PASSWORD }}
        run: npm run qa:google-signup

  # Issue #662 — nightly prod check: SERP favicon endpoints must stay 200 +
  # image/* at stable URLs (Google's favicon crawler fetches the homepage-linked
  # square PNG and root /favicon.ico via the vercel.json rewrite).
  favicon-prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    steps:
      - name: curl favicon endpoints (200 + image/*)
        run: |
          fail=0
          for url in \
            "https://www.setlistpickem.com/favicon.ico" \
            "https://www.setlistpickem.com/favicon/favicon-96x96.png" \
            "https://setlistpickem.com/favicon.ico"; do
            out=$(curl -sIL -o /dev/null -w "%{http_code} %{content_type}" "$url")
            code=${out%% *}
            ctype=${out#* }
            echo "$url -> $code $ctype"
            if [ "$code" != "200" ] || [ "${ctype#image/}" = "$ctype" ]; then
              echo "::error::$url returned '$code $ctype' — expected 200 + image/* (#662)"
              fail=1
            fi
          done
          exit $fail

  # Issue #348 — §C headers on deployed preview. Optional: set repo Variable QA_PREVIEW_BASE_URL.
  qa-preview-headers:
    runs-on: ubuntu-latest
    needs: verify
    if: ${{ vars.QA_PREVIEW_BASE_URL != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    env:
      QA_PREVIEW_BASE_URL: ${{ vars.QA_PREVIEW_BASE_URL }}
      QA_VERCEL_PROTECTION_BYPASS: ${{ secrets.QA_VERCEL_PROTECTION_BYPASS }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: qa:preview-headers (recipe §C)
        run: node scripts/qa/preview-cache-headers.mjs

  # #1148: build, functions, and rules skip when their paths did not change.
  # A ruleset that requires those job names treats a skip as "not successful".
  # ci-gate always reports. Skipped path-filtered jobs pass. A real failure
  # or a cancellation fails the gate. Patrick can require this check instead
  # of Vercel / build / functions / rules.
  ci-gate:
    name: ci-gate
    needs: [changes, verify, build, functions, rules]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Aggregate required CI results
        env:
          CI_GATE_CHANGES: ${{ needs.changes.result }}
          CI_GATE_VERIFY: ${{ needs.verify.result }}
          CI_GATE_BUILD: ${{ needs.build.result }}
          CI_GATE_FUNCTIONS: ${{ needs.functions.result }}
          CI_GATE_RULES: ${{ needs.rules.result }}
        run: node scripts/ci-gate.mjs
