# T0 Dependabot auto-merge (#967).
#
# Enables GitHub squash auto-merge for `*-safe` minor/patch groups only.
# Individual majors and the `actions-all` group are never enabled.
#
# `pull_request_target` is required because Dependabot `pull_request` runs
# get a read-only token. The workflow file that runs is the one on the
# default branch (`main`), so this file does nothing until it is promoted.
# Checkout stays on that default branch. Do not checkout the PR head and
# do not run PR code: the token can write.
#
# Required checks still gate the merge. A red `verify` / `build` / `functions`
# / Vercel check leaves the PR open. This workflow comments only when it
# cannot enable auto-merge, or when CI later fails on a T0 PR.

name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [staging]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  enable:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'staging' &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dependabot metadata
        id: metadata
        continue-on-error: true
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ github.token }}

      - name: Checkout policy from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Classify T0
        id: policy
        env:
          DEPENDABOT_AUTHOR: ${{ github.event.pull_request.user.login }}
          DEPENDABOT_ACTOR: ${{ github.actor }}
          DEPENDABOT_BASE: ${{ github.event.pull_request.base.ref }}
          DEPENDABOT_TITLE: ${{ github.event.pull_request.title }}
          DEPENDABOT_HEAD: ${{ github.event.pull_request.head.ref }}
          DEPENDABOT_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          DEPENDABOT_UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          DEPENDABOT_DRAFT: ${{ github.event.pull_request.draft }}
          DEPENDABOT_STATE: ${{ github.event.pull_request.state }}
          DEPENDABOT_METADATA_OK: ${{ steps.metadata.outcome == 'success' }}
        run: node scripts/dependabot-auto-merge-decision.mjs

      - name: Enable squash auto-merge
        id: enable
        if: steps.policy.outputs.action == 'enable'
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequestId = context.payload.pull_request.node_id;
            try {
              const result = await github.graphql(
                `mutation ($pullRequestId: ID!, $mergeMethod: PullRequestMergeMethod!) {
                  enablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId, mergeMethod: $mergeMethod}) {
                    pullRequest { number autoMergeRequest { enabledAt mergeMethod } }
                  }
                }`,
                { pullRequestId, mergeMethod: "SQUASH" },
              );
              core.info(`Enabled squash auto-merge: ${JSON.stringify(result)}`);
            } catch (error) {
              const text = `${error?.message || ""}\n${JSON.stringify(error?.errors || error || "")}`;
              if (/already/i.test(text) && /auto.?merge/i.test(text)) {
                core.info("Squash auto-merge is already enabled.");
                return;
              }
              core.setFailed(text);
            }

      - name: Fail closed when metadata cannot verify a safe group
        if: steps.policy.outputs.reason == 'metadata-unavailable'
        run: |
          echo "fetch-metadata did not verify this *-safe PR. Auto-merge was not enabled."
          exit 1

      - name: Comment when auto-merge did not enable
        if: failure()
        uses: actions/github-script@v9
        env:
          POLICY_REASON: ${{ steps.policy.outputs.reason }}
          POLICY_GROUP: ${{ steps.policy.outputs.group }}
        with:
          script: |
            const marker = "<!-- dependabot-t0-automerge-failure -->";
            const reason = process.env.POLICY_REASON || "workflow-failed";
            const group = process.env.POLICY_GROUP || "";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              "Dependabot T0 auto-merge did not enable for this pull request.",
              group ? `Group: \`${group}\`.` : "",
              `Reason: \`${reason}\`.`,
              "Required checks still have to pass before GitHub squash-merges a `*-safe` minor/patch group. Major updates and `actions-all` are not auto-merged. This comment is the failure alert; a green enable run does not comment.",
              runUrl,
            ].filter(Boolean).join("\n\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

  revoke:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Disable auto-merge after a non-Dependabot update
        uses: actions/github-script@v9
        with:
          script: |
            const marker = "<!-- dependabot-t0-automerge-revoked -->";
            const pullRequestId = context.payload.pull_request.node_id;
            try {
              await github.graphql(
                `mutation ($pullRequestId: ID!) {
                  disablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId}) {
                    pullRequest { number }
                  }
                }`,
                { pullRequestId },
              );
              core.info("Disabled auto-merge.");
            } catch (error) {
              const text = `${error?.message || ""}\n${JSON.stringify(error?.errors || error || "")}`;
              if (/auto.?merge|automatically merge/i.test(text) && /not|cannot|disabled|isn't/i.test(text)) {
                core.info("Auto-merge was not enabled.");
              } else {
                core.setFailed(text);
              }
            }
            const body = [
              marker,
              "Auto-merge was turned off because this Dependabot pull request was updated by someone other than `dependabot[bot]`.",
              "T0 auto-merge stays off until Dependabot pushes again and the commits are only Dependabot's. Major updates are never auto-merged.",
            ].join("\n\n");
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              per_page: 100,
            });
            if (comments.some((comment) => comment.body?.includes(marker))) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

  ci-failure:
    if: >-
      github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'success') &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout policy from the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve the Dependabot pull request
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            let number = run.pull_requests?.[0]?.number || 0;
            if (!number) {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: run.head_sha,
              });
              const match = associated.data.find((pr) =>
                pr.user?.login === "dependabot[bot]" &&
                pr.base?.ref === "staging" &&
                pr.state === "open",
              );
              number = match?.number || 0;
            }
            if (!number) {
              core.info("No open Dependabot pull request for this CI run.");
              core.setOutput("found", "false");
              return;
            }
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            core.setOutput("found", "true");
            core.setOutput("number", String(pr.number));
            core.setOutput("author", pr.user?.login || "");
            core.setOutput("base", pr.base?.ref || "");
            core.setOutput("title", pr.title || "");
            core.setOutput("head", pr.head?.ref || "");
            core.setOutput("draft", pr.draft ? "true" : "false");
            core.setOutput("state", pr.state || "");

      - name: Classify T0
        id: policy
        if: steps.pr.outputs.found == 'true'
        env:
          DEPENDABOT_MODE: t0
          DEPENDABOT_AUTHOR: ${{ steps.pr.outputs.author }}
          DEPENDABOT_BASE: ${{ steps.pr.outputs.base }}
          DEPENDABOT_TITLE: ${{ steps.pr.outputs.title }}
          DEPENDABOT_HEAD: ${{ steps.pr.outputs.head }}
          DEPENDABOT_DRAFT: ${{ steps.pr.outputs.draft }}
          DEPENDABOT_STATE: ${{ steps.pr.outputs.state }}
          DEPENDABOT_METADATA_OK: "true"
        run: node scripts/dependabot-auto-merge-decision.mjs

      - name: Comment when T0 CI failed
        if: steps.policy.outputs.action == 'enable'
        uses: actions/github-script@v9
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          POLICY_GROUP: ${{ steps.policy.outputs.group }}
        with:
          script: |
            const marker = "<!-- dependabot-t0-ci-failure -->";
            const number = Number(process.env.PR_NUMBER);
            const group = process.env.POLICY_GROUP || "";
            const conclusion = context.payload.workflow_run.conclusion;
            const runUrl = context.payload.workflow_run.html_url;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (conclusion !== "failure") {
              if (!existing) return;
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: [
                  marker,
                  "The latest CI run for this T0 Dependabot pull request succeeded. No further alert.",
                  runUrl,
                ].join("\n\n"),
              });
              return;
            }
            const body = [
              marker,
              "CI failed on this T0 Dependabot pull request, so auto-merge will not land it.",
              group ? `Group: \`${group}\`.` : "",
              "The pull request stays open. This is the only CI alert; a green run does not open a new comment.",
              runUrl,
            ].filter(Boolean).join("\n\n");
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body,
            });
