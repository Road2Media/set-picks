# Smoke production after a GitHub Release is published (#1162).
# www.setlistpickem.com is public, so this job does not require
# VERCEL_AUTOMATION_BYPASS_SECRET. Login uses the existing QA_* secrets.

name: production-smoke

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.event.release.tag_name || github.run_id }}
  cancel-in-progress: false

jobs:
  production-smoke:
    name: production-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QA_TEST_EMAIL: ${{ secrets.QA_TEST_EMAIL }}
      QA_TEST_PASSWORD: ${{ secrets.QA_TEST_PASSWORD }}
      QA_APPCHECK_DEBUG_TOKEN: ${{ secrets.QA_APPCHECK_DEBUG_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production smoke
        run: node scripts/smoke-deploy.mjs --target production
